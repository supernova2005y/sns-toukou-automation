<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>予約投稿</title>
<style>
:root{
  --bg:#FBF6E6; --sheet:#FFFDF5; --card:#FFFFFF; --ink:#1E2B2F; --sub:#4D5A5E;
  --line:#D6D0BC; --teal:#1F5F73; --tealLine:#9CC3CF; --green:#2E7D32; --greenSoft:#E3EEE4;
  --red:#B3261E; --redSoft:#FBE9E7;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font-size:22px;color:var(--teal)}
.counts{display:flex;gap:6px;font-size:13px}
.pill{padding:6px 10px;border-radius:999px;background:var(--greenSoft);color:#1E5B22}
.pill.done{background:#ECE6D3;color:#4A4636}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1/1;position:relative;border-radius:12px;overflow:hidden;border:0;padding:0;font:inherit;text-align:center}
.new{border:2px dashed #8FB894;background:var(--sheet);color:#1E5B22;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500}
.sched{background:var(--card);border:1.5px solid var(--tealLine);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.sched .when{font-size:13px;font-weight:700;color:var(--teal)}
.sched .to{font-size:11px;color:var(--sub)}
.sched .ex{font-size:11px;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.overdue{border-color:var(--red);background:var(--redSoft)}
.overdue .when{color:var(--red)}
.error{background:var(--redSoft);border:1.5px solid var(--red);font-size:11px;color:var(--red);padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.done{background-size:cover;background-position:center}
.done .ex{position:absolute;inset:auto 0 0 0;padding:8px;font-size:11px;line-height:1.35;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.empty{grid-column:1/-1;color:var(--sub);font-size:13px;padding:16px 4px}
/* シート */
.scrim{position:fixed;inset:0;background:rgba(20,30,32,.38)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--sheet);border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:92vh;overflow-y:auto}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.row{display:flex;align-items:center;justify-content:space-between}
h2{margin:0;font-size:17px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center}
label,.lbl{font-size:13px;font-weight:500;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:6px}
textarea,input[type=url],input[type=datetime-local]{border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:120px;line-height:1.6}
#xText{min-height:64px}
.counter{display:flex;justify-content:flex-end;gap:12px;font-size:12px;color:var(--sub)}
.counter .over{color:var(--red);font-weight:700}
.hint{font-size:12px;color:var(--sub);margin:0}
.chips{display:flex;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--sub);border:1.5px solid #B9B29A}
.chip[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.submit-row{display:flex;gap:8px}
.submit-row input{flex:1 1 auto;min-width:0;height:48px;padding:0 12px}
.submit{white-space:nowrap;flex:0 0 auto;height:48px;padding:0 22px;border:0;border-radius:12px;font:inherit;font-size:15px;font-weight:700;background:var(--green);color:#fff;cursor:pointer}
.submit:disabled{background:#DCD6C3;color:#6E6853;cursor:not-allowed}
.msg{font-size:13px;color:var(--red);margin:0;white-space:pre-wrap}
button.sched{cursor:pointer;font:inherit;color:inherit}
button.sched:hover{border-color:var(--teal)}
.locked{opacity:.85}
.danger{align-self:flex-start;height:44px;padding:0 4px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--red);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.mode{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-left:8px;vertical-align:middle;background:#ECE6D3;color:#4A4636}
.mode.on{background:var(--green);color:#fff}
.publish{height:48px;border:1.5px solid var(--green);border-radius:12px;background:#fff;color:var(--green);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.publish:disabled{border-color:#DCD6C3;color:#6E6853;cursor:not-allowed}
.logbox{margin-top:20px;font-size:12px;color:var(--sub)}
.logbox h3{font-size:13px;margin:0 0 6px;color:var(--ink)}
.logbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.logbox li{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-all}
.logbox li.bad{border-color:var(--red);color:var(--red)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>投稿<span class="mode" id="mode" hidden></span></h1>
    <div class="counts"><span class="pill" id="countSched">予約 0</span><span class="pill done" id="countDone">済み 0</span></div>
  </header>
  <div class="grid" id="grid">
    <button type="button" class="tile new" id="openBtn" aria-label="新しい投稿を予約">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7 12h10"/></svg>
      新しい予約
    </button>
  </div>
  <section class="logbox" id="logBox" hidden>
    <h3>最近の投稿の記録</h3>
    <ul id="logList"></ul>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" aria-labelledby="sheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="row">
    <h2 id="sheetTitle">新しい投稿</h2>
    <button type="button" class="icon-btn" id="closeBtn" aria-label="閉じる">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="field">
    <label for="text">言葉で伝える</label>
    <textarea id="text" rows="5" placeholder="今日のお知らせ、新メニュー、営業時間など"></textarea>
    <div class="counter"><span id="igCount">Instagram 0/2200</span><span id="xCount">X 0/280</span></div>
  </div>
  <div class="field" id="imageField">
    <label for="image">画像のURL（Instagram用・https の公開URL）</label>
    <input type="url" id="image" placeholder="https://…/photo.jpg" inputmode="url" autocomplete="off">
    <div id="uploadRow" hidden>
      <label for="file">またはPCの画像（JPEG）を選ぶ</label>
      <input type="file" id="file" accept="image/jpeg">
      <p class="hint" id="fileMsg"></p>
    </div>
    <p class="hint">いまは画像1枚。PCの画像は、画像の置き場所（STORAGE_*）を設定したときだけ選べます</p>
  </div>
  <div class="field" id="xTextField">
    <label for="xText">Xだけ別の文面（任意）</label>
    <textarea id="xText" rows="2" placeholder="空ならXにも上の本文を投稿します"></textarea>
  </div>
  <div class="chips">
    <button type="button" class="chip" id="chipIg" aria-pressed="true">Instagram</button>
    <button type="button" class="chip" id="chipX" aria-pressed="true">X</button>
  </div>
  <div class="field">
    <label for="when">投稿する日時</label>
    <div class="submit-row">
      <input type="datetime-local" id="when">
      <button type="button" class="submit" id="submitBtn" disabled>予約する</button>
    </div>
    <p class="hint" id="whenLabel"></p>
  </div>
  <p class="msg" id="msg" role="alert"></p>
  <button type="button" class="publish" id="publishBtn" hidden>保存した内容で今すぐ投稿</button>
  <button type="button" class="danger" id="cancelBtn" hidden>この予約を取り消す</button>
</section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { ig: true, x: true, sending: false, editing: null, publishEnabled: false, uploadEnabled: false, imageKey: "", loaded: "" };  // editing: { name, version }

// X と同じ数え方（日本語は1文字=2、URLは23）。サーバー側の x_weighted_length と同じ
function xLen(s) {
  let n = 0;
  const rest = s.normalize("NFC").replace(/https?:\/\/\S+/gi, () => { n += 23; return ""; });
  for (const ch of rest) {
    const c = ch.codePointAt(0);
    const one = c <= 0x10FF || (c >= 0x2000 && c <= 0x200D) || (c >= 0x2010 && c <= 0x201F) || (c >= 0x2032 && c <= 0x2037);
    n += one ? 1 : 2;
  }
  return n;
}
const pad = (n) => String(n).padStart(2, "0");
function fmt(d) { return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function localValue(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
// datetime-local の値に、このPCのタイムゾーン（例 +09:00）をつける
function withOffset(v) {
  const d = new Date(v);
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? "+" : "-";
  return `${v}:00${sign}${pad(Math.floor(Math.abs(off) / 60))}:${pad(Math.abs(off) % 60)}`;
}
function nextDefault() {
  const d = new Date(); d.setSeconds(0, 0);
  d.setHours(20, 0);
  if (d <= new Date()) d.setDate(d.getDate() + 1);
  return d;
}
const TARGET = { instagram: "Instagram", x: "X" };

function svgCheck() {
  return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="投稿済み"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
}
function svgClock(color) {
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`;
}
const DONE_COLORS = ["#7C9A7E", "#A88A6A", "#6F8FA0", "#B07A5A", "#9A7F8E", "#8E9A6B"];

function tile(p, i) {
  const editable = p.status === "scheduled" || p.status === "overdue";
  const el = document.createElement(editable ? "button" : "div");
  if (editable) el.type = "button";
  el.className = "tile";
  if (p.status === "error") {
    el.classList.add("error");
    el.textContent = p.error;
    el.title = p.name;
    return el;
  }
  const when = fmt(new Date(p.publish_at));
  const to = p.targets.map((t) => TARGET[t] || t).join("・");
  if (p.status === "done") {
    el.classList.add("done");
    el.style.backgroundColor = DONE_COLORS[i % DONE_COLORS.length];
    if (p.image_url && p.image_url.startsWith("https://")) el.style.backgroundImage = `url(${JSON.stringify(p.image_url)})`;
    const ex = document.createElement("span"); ex.className = "ex"; ex.textContent = p.excerpt;
    const ck = document.createElement("span"); ck.className = "check"; ck.innerHTML = svgCheck();
    el.append(ex, ck);
    el.title = `${when} ${to}`;
    return el;
  }
  el.classList.add("sched");
  if (p.status === "overdue") el.classList.add("overdue");
  const color = p.status === "overdue" ? "#B3261E" : "#1F5F73";
  el.innerHTML = svgClock(color);
  const w = document.createElement("span"); w.className = "when"; w.textContent = when;
  const t = document.createElement("span"); t.className = "to";
  t.textContent = p.status === "overdue" ? "時刻を過ぎています" : to;
  const ex = document.createElement("span"); ex.className = "ex"; ex.textContent = p.excerpt;
  el.append(w, t, ex);
  if (p.editable) {
    el.setAttribute("aria-label", `${when} ${to} の予約を変更`);
    el.addEventListener("click", () => openEdit(p.name));
  } else {
    el.classList.add("locked");
    el.addEventListener("click", () => {
      if (state.publishEnabled) publishRest(p);
      else toast("一部の投稿先に投稿済みのため、変更できません");
    });
  }
  el.title = p.name;
  return el;
}

async function load() {
  const res = await fetch("/api/posts");
  const { posts, publish_enabled, upload_enabled } = await res.json();
  state.publishEnabled = !!publish_enabled;
  state.uploadEnabled = !!upload_enabled;
  $("uploadRow").hidden = !state.uploadEnabled;
  $("mode").hidden = false;
  $("mode").className = state.publishEnabled ? "mode on" : "mode";
  $("mode").textContent = state.publishEnabled ? "投稿モード" : "下見モード";
  $("mode").title = state.publishEnabled
    ? "「今すぐ投稿」と、時刻が来た予約の自動投稿をします（この画面のサーバーを止めると止まります）"
    : "ここからは投稿しません。投稿するときは sns-post web --publish で起動します";
  loadLog();
  const grid = $("grid");
  grid.querySelectorAll(".tile:not(.new), .empty").forEach((n) => n.remove());
  posts.forEach((p, i) => grid.append(tile(p, i)));
  if (!posts.length) {
    const e = document.createElement("p"); e.className = "empty";
    e.textContent = "まだ投稿がありません。「新しい予約」から始めましょう";
    grid.append(e);
  }
  $("countSched").textContent = `予約 ${posts.filter((p) => p.status === "scheduled" || p.status === "overdue").length}`;
  $("countDone").textContent = `済み ${posts.filter((p) => p.status === "done").length}`;
}

function refresh() {
  const text = $("text").value;
  const xText = $("xText").value.trim();
  const xc = xLen(xText || text);
  $("igCount").textContent = `Instagram ${text.length}/2200`;
  $("xCount").textContent = `X ${xc}/280`;
  $("xCount").className = state.x && xc > 280 ? "over" : "";
  $("igCount").className = state.ig && text.length > 2200 ? "over" : "";
  $("chipIg").setAttribute("aria-pressed", String(state.ig));
  $("chipX").setAttribute("aria-pressed", String(state.x));
  $("imageField").hidden = !state.ig;
  $("xTextField").hidden = !state.x;
  const v = $("when").value;
  const d = v ? new Date(v) : null;
  const future = d && d > new Date();
  $("whenLabel").textContent = !d ? "日時を選んでください" : future ? `${fmt(d)} にポストします` : "過ぎた日時になっています";
  const img = $("image").value.trim();
  const ok = text.trim() && (state.ig || state.x) && future
    && !(state.x && xc > 280) && !(state.ig && (text.length > 2200 || !(img.startsWith("https://") || state.imageKey)));
  $("submitBtn").disabled = !ok || state.sending;
  const dirty = state.editing && snapshot() !== state.loaded;
  $("publishBtn").disabled = state.sending || !!dirty;
  $("publishBtn").textContent = dirty ? "変更を保存してから投稿できます" : "保存した内容で今すぐ投稿";
}
function setImageKey(key) {
  state.imageKey = key;
  $("file").value = "";
  $("fileMsg").textContent = key ? "PCの画像を上げてあります（上のURLを入れると、そちらを使います）" : "";
}
async function uploadFile() {
  const f = $("file").files[0];
  if (!f) return;
  if (f.type !== "image/jpeg") { $("fileMsg").textContent = "JPEG の画像だけ使えます"; $("file").value = ""; return; }
  $("fileMsg").textContent = "上げています…";
  try {
    const res = await fetch("/api/images", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: f });
    const data = await res.json();
    if (!res.ok) { $("fileMsg").textContent = data.error || "画像を上げられませんでした"; $("file").value = ""; return; }
    setImageKey(data.image_key);
  } catch (e) {
    $("fileMsg").textContent = "サーバーにつながりません";
  }
  refresh();
}
function snapshot() {
  return JSON.stringify([$("text").value, $("xText").value, $("image").value, state.imageKey, $("when").value, state.ig, state.x]);
}

let returnFocus = null;
function showSheet(editing) {
  state.editing = editing;
  $("sheetTitle").textContent = editing ? "予約を変更" : "新しい投稿";
  $("submitBtn").textContent = editing ? "変更する" : "予約する";
  $("cancelBtn").hidden = !editing;
  $("publishBtn").hidden = !(editing && state.publishEnabled);
  state.loaded = editing ? snapshot() : "";
  $("msg").textContent = "";
  returnFocus = document.activeElement;
  $("scrim").hidden = false; $("sheet").hidden = false;
  refresh(); $("text").focus();
}
function openSheet() {
  if (state.editing) {  // 編集の途中の内容は持ち越さない
    ["text", "xText", "image", "when"].forEach((id) => { $(id).value = ""; });
    setImageKey("");
    state.ig = true; state.x = true;
  }
  if (!$("when").value) $("when").value = localValue(nextDefault());
  showSheet(null);
}
async function openEdit(name) {
  try {
    const res = await fetch(`/api/posts/${encodeURIComponent(name)}`);
    const data = await res.json();
    if (!res.ok) { toast(data.error || "予約を開けませんでした"); await load(); return; }
    const p = data.post;
    $("text").value = p.text;
    $("xText").value = p.x_text || "";
    $("image").value = p.image_url || "";
    setImageKey(p.image_key || "");
    $("when").value = localValue(new Date(p.publish_at));
    state.ig = p.targets.includes("instagram");
    state.x = p.targets.includes("x");
    showSheet({ name: p.name, version: p.version });
  } catch (e) {
    toast("サーバーにつながりません");
  }
}
function closeSheet() {
  $("scrim").hidden = true; $("sheet").hidden = true;
  (returnFocus && document.contains(returnFocus) ? returnFocus : $("openBtn")).focus();
}
function clearForm() {
  ["text", "xText", "image", "when"].forEach((id) => { $(id).value = ""; });
  setImageKey("");
  state.ig = true; state.x = true; state.editing = null;
}
function toast(t) {
  $("toast").textContent = t; $("toast").hidden = false;
  setTimeout(() => { $("toast").hidden = true; }, 2500);
}

async function submit() {
  state.sending = true; refresh(); $("msg").textContent = "";
  const editing = state.editing;
  const body = {
    text: $("text").value,
    targets: [state.ig && "instagram", state.x && "x"].filter(Boolean),
    image_url: state.ig ? $("image").value.trim() : null,
    image_key: state.ig && state.imageKey ? state.imageKey : null,
    x_text: state.x ? $("xText").value.trim() || null : null,
    publish_at: withOffset($("when").value),
  };
  if (editing) body.version = editing.version;
  try {
    const url = editing ? `/api/posts/${encodeURIComponent(editing.name)}` : "/api/posts";
    const res = await fetch(url, { method: editing ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { $("msg").textContent = data.error || "保存できませんでした"; return; }
    clearForm();
    closeSheet();
    toast(`${fmt(new Date(data.post.publish_at))} に${editing ? "変更" : "予約"}しました`);
    await load();
  } catch (e) {
    $("msg").textContent = "サーバーにつながりません。sns-post web が動いているか確認してください";
  } finally {
    state.sending = false; refresh();
  }
}

$("openBtn").addEventListener("click", openSheet);
$("closeBtn").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
$("sheet").addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
["text", "image", "when"].forEach((id) => $(id).addEventListener("input", refresh));
$("file").addEventListener("change", uploadFile);
$("chipIg").addEventListener("click", () => { state.ig = !state.ig; refresh(); });
$("chipX").addEventListener("click", () => { state.x = !state.x; refresh(); });
$("submitBtn").addEventListener("click", submit);

async function cancelPost() {
  const editing = state.editing;
  if (!editing || state.sending) return;
  if (!confirm("この予約を取り消しますか？\n（ファイルは posts/cancelled/ に移るので、あとから戻せます）")) return;
  state.sending = true; refresh(); $("msg").textContent = "";
  try {
    const res = await fetch(`/api/posts/${encodeURIComponent(editing.name)}/cancel`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ version: editing.version }),
    });
    const data = await res.json();
    if (!res.ok) { $("msg").textContent = data.error || "取り消せませんでした"; return; }
    clearForm();
    closeSheet();
    toast("予約を取り消しました");
    await load();
  } catch (e) {
    $("msg").textContent = "サーバーにつながりません。sns-post web が動いているか確認してください";
  } finally {
    state.sending = false; refresh();
  }
}
$("cancelBtn").addEventListener("click", cancelPost);
$("xText").addEventListener("input", refresh);

function confirmText(targets) {
  const to = targets.map((t) => TARGET[t] || t).join("・");
  const cost = targets.includes("x") ? "\n（X は1回ごとに料金がかかります）" : "";
  return `${to} に今すぐ投稿しますか？\n投稿は取り消せません（消すときはアプリから）${cost}`;
}
async function doPublish(name, version) {
  const res = await fetch(`/api/posts/${encodeURIComponent(name)}/publish`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ version }),
  });
  const data = await res.json();
  return { res, data };
}
async function publishNow() {
  const editing = state.editing;
  if (!editing || state.sending) return;
  const targets = [state.ig && "instagram", state.x && "x"].filter(Boolean);
  if (!confirm(confirmText(targets))) return;
  state.sending = true; refresh(); $("msg").textContent = "投稿しています…";
  try {
    const { res, data } = await doPublish(editing.name, editing.version);
    if (!res.ok) { $("msg").textContent = data.error || "投稿できませんでした"; return; }
    if (!data.ok) { $("msg").textContent = (data.log || []).join("\n") || "投稿できませんでした"; await load(); return; }
    clearForm();
    closeSheet();
    toast("投稿しました");
    await load();
  } catch (e) {
    $("msg").textContent = "サーバーにつながりません。sns-post web --publish が動いているか確認してください";
  } finally {
    state.sending = false; refresh();
  }
}
$("publishBtn").addEventListener("click", publishNow);

// 一部だけ投稿済みの予約：残りの投稿先に投稿する
async function publishRest(p) {
  const rest = p.targets.filter((t) => !p.posted.includes(t));
  if (!rest.length || !confirm(confirmText(rest))) return;
  try {
    const r = await fetch(`/api/posts/${encodeURIComponent(p.name)}`);
    const d = await r.json();
    if (!r.ok) { toast(d.error || "予約を開けませんでした"); await load(); return; }
    const { res, data } = await doPublish(p.name, d.post.version);
    toast(res.ok && data.ok ? "投稿しました" : (data.error || "投稿できませんでした。記録を見てください"));
  } catch (e) {
    toast("サーバーにつながりません");
  }
  await load();
}

async function loadLog() {
  if (!state.publishEnabled) { $("logBox").hidden = true; return; }
  try {
    const { log } = await (await fetch("/api/log")).json();
    $("logBox").hidden = !log.length;
    const ul = $("logList");
    ul.replaceChildren(...log.slice(0, 10).map((e) => {
      const li = document.createElement("li");
      li.textContent = `${fmt(new Date(e.at))}  ${e.line}`;
      if (/^\[(失敗|スキップ|エラー|自動投稿を止めました)\]/.test(e.line)) li.className = "bad";
      return li;
    }));
  } catch (e) { /* つながらないときは前の表示のまま */ }
}

// 自動投稿の結果が画面に出るよう、入力中でなければ30秒ごとに読み直す
setInterval(() => { if ($("sheet").hidden) load(); }, 30000);
load();
</script>
