[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sns-post"
version = "0.1.0"
description = "Instagram と X への予約投稿を、公式APIだけで行う小さなツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "requests-oauthlib>=1.3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sns-post = "sns_post.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
